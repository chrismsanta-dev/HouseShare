<div class="w-full h-full flex items-center justify-center">
  <form
    [formGroup]="loginForm"
    class="w-100 h-fit flex flex-col justify-center gap-6 bg-white shadow-sm p-10 rounded-md"
  >
    <h1 class="text-2xl">Login</h1>
    <input
      class="outline rounded-sm p-2"
      formControlName="email"
      type="email"
      placeholder="Email"
    />
    <input
      class="outline rounded-sm p-2"
      formControlName="password"
      type="password"
      placeholder="Password"
    />
    <button
      (click)="login()"
      type="button"
      class="w-full bg-blue-600 text-white cursor-pointer p-2 rounded-sm"
    >
      Login
    </button>
    <div class="flex flex-row gap-1">
      <p>Don't have an account?</p>
      <a class="text-blue-600 cursor-pointer" href="register">Create one now!</a>
    </div>
  </form>
</div>
